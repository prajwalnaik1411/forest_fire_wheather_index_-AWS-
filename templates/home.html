<!DOCTYPE html>
<html>
<head>
    <title>FWI Prediction</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Montserrat', sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        .login{
            background: rgba(255,255,255,0.1);
            padding:40px;
            width:450px;
            border-radius:20px;
            backdrop-filter: blur(15px);
            box-shadow:0 15px 35px rgba(0,0,0,0.4);
            border:1px solid rgba(255,255,255,0.2);
            text-align:center;
            color:white;
        }

        .login h1{
            margin-bottom:25px;
            font-size:22px;
            font-weight:700;
        }

        input{
            width:100%;
            padding:12px;
            margin:8px 0;
            border:none;
            border-radius:10px;
            outline:none;
            background:rgba(255,255,255,0.2);
            color:white;
            transition:0.3s;
        }

        input::placeholder{
            color:#e0e0e0;
        }

        input:focus{
            background:rgba(255,255,255,0.35);
            transform:scale(1.05);
            box-shadow:0 0 10px rgba(255,255,255,0.5);
        }

        button{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:none;
            border-radius:12px;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            color:white;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            transition:0.3s;
        }

        button:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 20px rgba(0,114,255,0.6);
        }

        .result-box{
            margin-top:25px;
            padding:20px;
            width:100%;
            border-radius:15px;
            font-size:20px;
            font-weight:600;
            background:rgba(0,255,213,0.15);
            border:2px solid rgba(0,255,213,0.6);
            color:#00ffd5;
            box-shadow:0 0 15px rgba(0,255,213,0.5);
        }

    </style>
</head>

<body>

<div class="login">
    <h1>🔥 FWI (Fire Weather Index) Prediction</h1>

    <form action="{{ url_for('predict_datapoint')}}" method="post">

        <input type="text" name="Temperature" placeholder="Temperature" required="required" />
        <input type="text" name="RH" placeholder="RH" required="required" />
        <input type="text" name="Ws" placeholder="Ws" required="required" />
        <input type="text" name="Rain" placeholder="Rain" required="required" />
        <input type="text" name="FFMC" placeholder="FFMC" required="required" />
        <input type="text" name="DMC" placeholder="DMC" required="required" />
        <input type="text" name="ISI" placeholder="ISI" required="required" />
        <input type="text" name="Classes" placeholder="Classes" required="required" />
        <input type="text" name="Region" placeholder="Region" required="required" />

        <button type="submit">Predict</button>

    </form>

    <div class="result-box">
        THE FWI Prediction is {{results}}
    </div>

</div>

</body>
</html>
